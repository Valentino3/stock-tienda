# Postgres desechable para los tests de navegador.
#
# No es una réplica de producción: producción es Neon. Es una base vacía y
# local contra la que los tests pueden abrir cajas, cobrar y facturar sin tocar
# datos de nadie. Se levanta con `npm run e2e:db` y se tira con `docker compose down -v`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: stock-tienda-test-db
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock_test
      # UTC como Neon y como Vercel. Todas las columnas de fecha del schema son
      # `timestamp` SIN zona horaria: si la base de test corriera en otro huso,
      # los tests de arqueo y de reportes compararían contra horas distintas de
      # las de producción y fallarían por una razón que no es la real.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5433:5432"
    # Sin volumen persistente a propósito: cada `down` deja la base limpia y el
    # seed vuelve a correr de cero. Un estado que sobrevive entre corridas es
    # cómo los tests de navegador se vuelven irreproducibles.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock_test"]
      interval: 2s
      timeout: 3s
      retries: 30
